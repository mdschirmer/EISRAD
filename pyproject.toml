[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eisrad"
dynamic = ["version"]
description = "Evaluation of Image Segmentations using RADar plots"
readme = "README.md"
license = "MIT"
authors = [{ name = "Markus D. Schirmer", email = "software@markus-schirmer.com" }]
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.7",
  "nibabel>=5.0",
  "numpy>=1.24",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.10",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/mdschirmer/EISRAD"

[project.scripts]
eisrad = "eisrad.__main__:main"

[tool.setuptools]
packages = ["eisrad"]

[tool.setuptools.dynamic]
version = { attr = "eisrad.__version__" }
